<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Setup - Glide</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>
    <div class="background-decorations">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="payment-panel">
        <div class="logo-container">
            <span class="logo-text">GLIDE</span>
            <span class="logo-subtitle">Secure Payment Setup</span>
        </div>

        <!-- Dynamic Card Display -->
        <div class="credit-card-preview" id="credit-card">
            <div class="card-chip"></div>
            <div class="card-number" id="preview-number">•••• •••• •••• ••••</div>
            <div class="card-info">
                <div class="info-block">
                    <span class="info-label">Card Holder</span>
                    <span class="info-value" id="preview-name">YOUR NAME</span>
                </div>
                <div class="info-block">
                    <span class="info-label">Expires</span>
                    <span class="info-value" id="preview-expiry">MM/YY</span>
                </div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="card-name" placeholder="Cardholder Name" required>
            <input type="text" id="card-number" placeholder="Card Number" maxlength="19" required>
            <div class="row">
                <input type="text" id="card-expiry" placeholder="MM/YY" maxlength="5" required>
                <input type="text" id="card-cvc" placeholder="CVC" maxlength="4" required>
            </div>
            <input type="text" id="billing-zip" placeholder="Billing Zip Code" maxlength="10" required>
        </div>

        <button id="pay-btn">Complete Setup</button>
        <button id="skip-btn" class="secondary-btn">Set Up Later</button>
    </div>

    <script type="module" src="payment.js"></script>
</body>
</html>
